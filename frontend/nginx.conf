server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application React (SPA) : toute URL qui n'est pas un fichier réel renvoie index.html,
    # puis React Router affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers de /assets ont un nom unique à chaque build : on peut les mettre en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit pas être mis en cache, sinon le navigateur garde une ancienne version
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
